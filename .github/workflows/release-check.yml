name: Release candidate

on:
  pull_request:
    paths:
      - .github/workflows/release-check.yml
      - CHANGELOG.md
      - js/**
      - python/**
      - scripts/check_release_version.py
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Verify package versions
        if: startsWith(github.ref, 'refs/tags/') == false
        run: python scripts/check_release_version.py

      - name: Verify package versions and tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release_version.py --tag "$RELEASE_TAG"

      - name: Install JavaScript dependencies
        working-directory: js
        run: npm ci

      - name: Type-check JavaScript package
        working-directory: js
        run: npm run typecheck

      - name: Test JavaScript package
        working-directory: js
        run: npm test

      - name: Build JavaScript package
        working-directory: js
        run: npm run build

      - name: Install Python build and test dependencies
        working-directory: python
        run: python -m pip install build twine pytest -e ".[integrations]"

      - name: Test Python package
        working-directory: python
        run: pytest -q

      - name: Create distribution directories
        run: mkdir -p release-dist/npm release-dist/python

      - name: Pack npm distribution
        working-directory: js
        run: npm pack --pack-destination ../release-dist/npm

      - name: Build Python distributions
        working-directory: python
        run: python -m build --outdir ../release-dist/python

      - name: Check Python distribution metadata
        run: python -m twine check release-dist/python/*

      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-distributions-${{ github.sha }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 7
